# Venue layout and time model - transcribed from docs/04 sections 2 and 3.
#
# The schematic layout is generated around `venue_center` using local metric offsets
# (pyproj UTM 43N) converted to WGS84. If the user supplies 00_common/config/zones.geojson
# the generator uses that instead and only reads attributes from here.
meta:
  version: "1.0"
  source: "docs/04_DATA_AND_SYNTHETIC_WORLD.md sections 2-3"

venue:
  event_id: EVENT
  name: Mega religious gathering (demo)
  # Approximate Ramkund area, Nashik. docs/04 section 2 says VERIFY on a map;
  # any coordinates work for the demo. Override here if a real site is chosen.
  venue_center: {lat: 20.0063, lon: 73.7926}
  verified_on_map: false
  utm_epsg: 32643        # UTM zone 43N, metric CRS for areas and buffers
  wgs84_epsg: 4326
  sectors:
    SA: {name: River front sector, zones: [Z01, Z02, Z06]}
    SB: {name: Approach and holding sector, zones: [Z03, Z04, Z05]}
    SC: {name: Market and transit sector, zones: [Z07, Z08]}

time:
  timezone: Asia/Kolkata
  utc_offset: "+05:30"
  grid_min: 15              # main time grid
  network_grid_min: 5       # D19 network telemetry is finer
  history_start: "2027-07-04T00:00:00+05:30"   # 28 days of normal context
  event_days:
    - {date: "2027-08-01", kind: arrival_day,  multiplier_key: arrival_day_multiplier}
    - {date: "2027-08-02", kind: snan_day,     multiplier_key: snan_day_multiplier}
    - {date: "2027-08-03", kind: post_peak,    multiplier_key: post_peak_multiplier}
  demo_now: "2027-08-02T06:00:00+05:30"
  # Open-Meteo historical weather is fetched for the same month/day of this year
  # and shifted to the event year.
  weather_source_year: 2025
  # The peak date mirrors a reported Amrit Snan date - docs/04 says verify official dates;
  # the demo only needs "a peak day".
  peak_date_verified: false

# ---------------------------------------------------------------- zones (8)
# usable_area_m2 = area_m2 * usable_share
# safe_capacity  = usable_area_m2 * assumptions.crowd.design_density_p_m2
zones:
  Z01:
    name: Ghat A (river front)
    type: ghat
    area_m2: 12000
    usable_share: 0.70
    low_lying: true
    drainage_capacity_mm_hr: 20
    notes: main bathing ghat
    attributes: {sensitive_site: true, cooking_stalls: 0, tent_density: 0.1, critical: true}
  Z02:
    name: Ghat B
    type: ghat
    area_m2: 10000
    usable_share: 0.70
    low_lying: true
    drainage_capacity_mm_hr: 20
    notes: second ghat
    attributes: {sensitive_site: true, cooking_stalls: 0, tent_density: 0.1, critical: true}
  Z03:
    name: Temple approach corridor
    type: corridor
    area_m2: 6000
    usable_share: 0.80
    low_lying: false
    drainage_capacity_mm_hr: 35
    notes: cooking stalls, fire risk
    attributes: {sensitive_site: true, cooking_stalls: 40, tent_density: 0.5, critical: true}
  Z04:
    name: Main pedestrian approach
    type: corridor
    area_m2: 9000
    usable_share: 0.85
    low_lying: false
    drainage_capacity_mm_hr: 35
    notes: ""
    attributes: {sensitive_site: false, cooking_stalls: 5, tent_density: 0.2, critical: false}
  Z05:
    name: Gate plaza / holding area
    type: holding
    area_m2: 15000
    usable_share: 0.80
    low_lying: false
    drainage_capacity_mm_hr: 40
    notes: gates G02, G03
    attributes: {sensitive_site: false, cooking_stalls: 8, tent_density: 0.3, critical: true}
  Z06:
    name: Bridge B01 approach
    type: bridge
    area_m2: 3000
    usable_share: 0.90
    low_lying: true
    drainage_capacity_mm_hr: 15
    notes: links Z02 to far bank
    attributes: {sensitive_site: false, cooking_stalls: 0, tent_density: 0.0, critical: true}
  Z07:
    name: Market & food street
    type: market
    area_m2: 8000
    usable_share: 0.60
    low_lying: false
    drainage_capacity_mm_hr: 30
    notes: gate G04
    attributes: {sensitive_site: false, cooking_stalls: 60, tent_density: 0.7, critical: false}
  Z08:
    name: Transit & parking hub
    type: hub
    area_m2: 20000
    usable_share: 0.50
    low_lying: false
    drainage_capacity_mm_hr: 45
    notes: gate G01
    attributes: {sensitive_site: false, cooking_stalls: 10, tent_density: 0.2, critical: false}

# Undirected adjacency, docs/04 section 2.1.
adjacency:
  - [Z08, Z05]
  - [Z05, Z04]
  - [Z05, Z07]
  - [Z04, Z03]
  - [Z04, Z07]
  - [Z03, Z01]
  - [Z03, Z02]
  - [Z02, Z06]

# ------------------------------------------------- crowd routing (docs/04 section 5.5)
# Directed movement graph for the compartment model. `split` weights must sum to 1
# per (phase, from-zone). `capacity_link` names the link whose capacity throttles the flow.
routing:
  inbound:
    Z08: {to: {Z05: 1.00}}
    Z05: {to: {Z04: 0.70, Z07: 0.30}}
    Z04: {to: {Z03: 1.00}}
    Z03: {to: {Z01: 0.60, Z02: 0.40}}
    Z07: {to: {Z04: 1.00}}
  outbound:
    Z01: {to: {Z03: 1.00}}
    Z02: {to: {Z03: 0.50, Z06: 0.50}}
    Z06: {to: {E05: 1.00}}
    Z03: {to: {Z04: 1.00}}
    Z04: {to: {Z05: 1.00}}
    Z05: {to: {E01: 0.60, E02: 0.40}}
    Z07: {to: {Z04: 0.50, E06: 0.50}}

# ------------------------------------------------------------- gates (4)
gates:
  G01: {zone_id: Z08, name: Hub gate,        secure: false, throughput_p_min: 60}
  G02: {zone_id: Z05, name: Plaza gate A,    secure: true,  throughput_p_min: 60}
  G03: {zone_id: Z05, name: Plaza gate B,    secure: true,  throughput_p_min: 60}
  G04: {zone_id: Z07, name: Market gate,     secure: false, throughput_p_min: 60}

# ------------------------------------------------------------- exits (6)
exits:
  E01: {zone_id: Z05, name: Plaza exit,          width_m: 8.0, status: open}
  E02: {zone_id: Z08, name: Hub exit,            width_m: 12.0, status: open}
  E03: {zone_id: Z03, name: Corridor side lane,  width_m: 4.0, status: open}
  E04: {zone_id: Z01, name: Ghat A emergency,    width_m: 6.0, status: open}
  E05: {zone_id: Z06, name: Far bank exit,       width_m: 5.0, status: open}
  E06: {zone_id: Z07, name: Market exit,         width_m: 6.0, status: open}

# --------------------------------------------------- bridge and key links
bridges:
  B01: {zone_id: Z06, name: River bridge, width_m: 6.0, capacity_p_min: 468, status: open}

# Key road segments R01-R10 and intersections J01-J06 are mapped to OSM edge/node IDs
# (nearest to the schematic positions) or to synthetic grid IDs in key_links.csv.
key_links:
  R01: {name: City approach north, lanes: 2, length_m: 1200, maxspeed_kmh: 50}
  R02: {name: City approach south, lanes: 2, length_m: 1400, maxspeed_kmh: 50}
  R03: {name: Hub access road,     lanes: 2, length_m: 600,  maxspeed_kmh: 40}
  R04: {name: Parking P1 link,     lanes: 1, length_m: 400,  maxspeed_kmh: 30}
  R05: {name: Parking P2 link,     lanes: 2, length_m: 700,  maxspeed_kmh: 40}
  R06: {name: Parking P3 link,     lanes: 1, length_m: 500,  maxspeed_kmh: 30}
  R07: {name: Riverside road,      lanes: 2, length_m: 900,  maxspeed_kmh: 40}
  R08: {name: Market street,       lanes: 1, length_m: 450,  maxspeed_kmh: 30}
  R09: {name: Hospital link,       lanes: 2, length_m: 1100, maxspeed_kmh: 50}
  R10: {name: Fire station link,   lanes: 2, length_m: 800,  maxspeed_kmh: 50}
key_intersections:
  J01: {name: North gateway junction,  approaches: [R01, R03]}
  J02: {name: South gateway junction,  approaches: [R02, R03]}
  J03: {name: Hub junction,            approaches: [R03, R04, R05]}
  J04: {name: Riverside junction,      approaches: [R05, R07, R09]}
  J05: {name: Market junction,         approaches: [R07, R08, R06]}
  J06: {name: Emergency junction,      approaches: [R09, R10]}

# City entry nodes used as traffic assignment origins (docs/04 section 5, M04 card).
entry_nodes: [R01, R02]

# ------------------------------------------------------- parking and transit
parking_sites:
  P1: {name: North lot,  zone_id: Z08, link: R04}
  P2: {name: Main lot,   zone_id: Z08, link: R05}
  P3: {name: Market lot, zone_id: Z07, link: R06}
shuttle_routes:
  SH1: {name: P2 to G01, from: P2, to: G01, length_km: 3.2}
  SH2: {name: P3 to G04, from: P3, to: G04, length_km: 2.4}

# ------------------------------------------------------------- facilities
hospitals:
  H01: {name: District hospital, zone_id: null, inside_venue: false, link: R09}
  H02: {name: Event field hospital, zone_id: Z08, inside_venue: true, link: R03}
medical_posts:
  MP01: {zone_id: Z01}
  MP02: {zone_id: Z03}
  MP03: {zone_id: Z05}
  MP04: {zone_id: Z07}
police_posts:
  PP01: {zone_id: Z01}
  PP02: {zone_id: Z04}
  PP03: {zone_id: Z05}
  PP04: {zone_id: Z08}
fire_stations:
  FS01: {name: Venue fire station, zone_id: Z08, link: R10, turnout_min: 2}
shelters:
  SH01: {zone_id: Z08, capacity_persons: 8000}
  SH02: {zone_id: Z07, capacity_persons: 5000}
# Ambulance staging candidate sites. NOTE: docs/02 section 3 has no AS prefix in its ID
# table; docs/04 section 2.2 requires AS01-AS06. See plans/PHASE_1.md decision D2 -
# AS is treated as a `facility` ID and is the one documented extension to the ID table.
ambulance_staging:
  AS01: {zone_id: Z01}
  AS02: {zone_id: Z03}
  AS03: {zone_id: Z04}
  AS04: {zone_id: Z05}
  AS05: {zone_id: Z07}
