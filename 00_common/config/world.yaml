# Venue layout and time model - transcribed from docs/04 sections 2 and 3.
#
# The schematic layout is generated around `venue_center` using local metric offsets
# (pyproj UTM 43N) converted to WGS84. If the user supplies 00_common/config/zones.geojson
# the generator uses that instead and only reads attributes from here.
meta:
  version: "1.0"
  source: "docs/04_DATA_AND_SYNTHETIC_WORLD.md sections 2-3"

venue:
  event_id: EVENT
  name: Mega religious gathering (demo)
  # Approximate Ramkund area, Nashik. docs/04 section 2 says VERIFY on a map;
  # any coordinates work for the demo. Override here if a real site is chosen.
  venue_center: {lat: 20.0063, lon: 73.7926}
  verified_on_map: false
  utm_epsg: 32643        # UTM zone 43N, metric CRS for areas and buffers
  wgs84_epsg: 4326
  sectors:
    SA: {name: River front sector, zones: [Z01, Z02, Z06]}
    SB: {name: Approach and holding sector, zones: [Z03, Z04, Z05]}
    SC: {name: Market and transit sector, zones: [Z07, Z08]}

time:
  timezone: Asia/Kolkata
  utc_offset: "+05:30"
  grid_min: 15              # main time grid
  network_grid_min: 5       # D19 network telemetry is finer
  history_start: "2027-07-04T00:00:00+05:30"   # 28 days of normal context
  event_days:
    - {date: "2027-08-01", kind: arrival_day,  multiplier_key: arrival_day_multiplier}
    - {date: "2027-08-02", kind: snan_day,     multiplier_key: snan_day_multiplier}
    - {date: "2027-08-03", kind: post_peak,    multiplier_key: post_peak_multiplier}
  demo_now: "2027-08-02T06:00:00+05:30"
  # Open-Meteo historical weather is fetched for the same month/day of this year
  # and shifted to the event year.
  weather_source_year: 2025
  # The peak date mirrors a reported Amrit Snan date - docs/04 says verify official dates;
  # the demo only needs "a peak day".
  peak_date_verified: false

# ---------------------------------------------------------------- zones (8)
# usable_area_m2 = area_m2 * usable_share
# safe_capacity  = usable_area_m2 * assumptions.crowd.design_density_p_m2
zones:
  Z01:
    name: Ghat A (river front)
    type: ghat
    area_m2: 12000
    usable_share: 0.70
    low_lying: true
    drainage_capacity_mm_hr: 20
    notes: main bathing ghat
    attributes: {sensitive_site: true, cooking_stalls: 0, tent_density: 0.1, critical: true}
  Z02:
    name: Ghat B
    type: ghat
    area_m2: 10000
    usable_share: 0.70
    low_lying: true
    drainage_capacity_mm_hr: 20
    notes: second ghat
    attributes: {sensitive_site: true, cooking_stalls: 0, tent_density: 0.1, critical: true}
  Z03:
    name: Temple approach corridor
    type: corridor
    area_m2: 6000
    usable_share: 0.80
    low_lying: false
    drainage_capacity_mm_hr: 35
    notes: cooking stalls, fire risk
    attributes: {sensitive_site: true, cooking_stalls: 40, tent_density: 0.5, critical: true}
  Z04:
    name: Main pedestrian approach
    type: corridor
    area_m2: 9000
    usable_share: 0.85
    low_lying: false
    drainage_capacity_mm_hr: 35
    notes: ""
    attributes: {sensitive_site: false, cooking_stalls: 5, tent_density: 0.2, critical: false}
  Z05:
    name: Gate plaza / holding area
    type: holding
    area_m2: 15000
    usable_share: 0.80
    low_lying: false
    drainage_capacity_mm_hr: 40
    notes: gates G02, G03
    attributes: {sensitive_site: false, cooking_stalls: 8, tent_density: 0.3, critical: true}
  Z06:
    name: Bridge B01 approach
    type: bridge
    area_m2: 3000
    usable_share: 0.90
    low_lying: true
    drainage_capacity_mm_hr: 15
    notes: links Z02 to far bank
    attributes: {sensitive_site: false, cooking_stalls: 0, tent_density: 0.0, critical: true}
  Z07:
    name: Market & food street
    type: market
    area_m2: 8000
    usable_share: 0.60
    low_lying: false
    drainage_capacity_mm_hr: 30
    notes: gate G04
    attributes: {sensitive_site: false, cooking_stalls: 60, tent_density: 0.7, critical: false}
  Z08:
    name: Transit & parking hub
    type: hub
    area_m2: 20000
    usable_share: 0.50
    low_lying: false
    drainage_capacity_mm_hr: 45
    notes: gate G01
    attributes: {sensitive_site: false, cooking_stalls: 10, tent_density: 0.2, critical: false}

# Undirected adjacency, docs/04 section 2.1.
adjacency:
  - [Z08, Z05]
  - [Z05, Z04]
  - [Z05, Z07]
  - [Z04, Z03]
  - [Z04, Z07]
  - [Z03, Z01]
  - [Z03, Z02]
  - [Z02, Z06]

# ------------------------------------------------- crowd routing (docs/04 section 5.5)
# Directed movement graph for the compartment model. Split weights must sum to 1 per
# (phase, from-zone) - a Phase 1 test asserts this.
#
# `inbound` carries people toward the ghats; `outbound` carries them back to the exits.
# Zones absent from `inbound` (Z01, Z02) are the destinations: arriving crowd dwells there
# and then turns around, which is how a bathing visit is represented.
routing:
  inbound:
    Z08: {to: {Z05: 1.00}}
    Z05: {to: {Z04: 0.70, Z07: 0.30}}
    Z04: {to: {Z03: 1.00}}
    Z03: {to: {Z01: 0.60, Z02: 0.40}}
    Z07: {to: {Z04: 1.00}}
  outbound:
    Z01: {to: {Z03: 1.00}}
    Z02: {to: {Z03: 0.50, Z06: 0.50}}
    Z06: {to: {E05: 1.00}}
    Z03: {to: {Z04: 1.00}}
    Z04: {to: {Z05: 1.00}}
    Z05: {to: {E01: 0.60, E02: 0.40}}
    Z07: {to: {Z04: 0.50, E06: 0.50}}

  # Effective walkable width of each zone-to-zone link, metres. The per-step throughput is
  #     capacity_p_min = crowd.exit_specific_flow_p_per_m_s * width_m * 60
  # so these widths are what create the bottlenecks and the ACCUMULATION behaviour that
  # M03 detects. Links to an exit (E01..E06) use that exit's own width from `exits` above.
  # PLACEHOLDERS: measure the real approach widths on site before relying on them.
  link_width_m:
    "Z08>Z05": 24.0    # hub to plaza, the widest approach
    "Z05>Z04": 18.0    # plaza to the main pedestrian approach
    "Z05>Z07": 10.0    # plaza to the market street
    "Z04>Z03": 12.0    # approach into the temple corridor
    "Z03>Z01": 9.0     # corridor onto Ghat A - the primary chokepoint
    "Z03>Z02": 8.0     # corridor onto Ghat B
    "Z07>Z04": 10.0
    "Z01>Z03": 9.0     # return flows share the same physical width
    "Z02>Z03": 8.0
    "Z02>Z06": 6.0     # onto the bridge approach
    "Z03>Z04": 12.0
    "Z04>Z05": 18.0

  # A closed link in a scenario (S06 R07, S12 B01) maps onto the pedestrian links it
  # actually severs. B01 is the river bridge, reached through Z06 and crossed to E05.
  closure_map:
    B01: ["Z06>E05"]
    R07: []            # R07 is a road; it affects M04, not pedestrian movement

# ------------------------------------------------------------- gates (4)
# `throughput_p_min` is PER GATE and overrides the single assumptions.crowd figure, because
# the gates are not the same size and that difference is what makes S05 behave correctly.
# Each value is the project's own pedestrian physics applied to the gate clear width:
#     1.3 p/m/s * width_m * 60 s
# Sizing, against a snan-day peak of 10,206 arrivals per 15-min step:
#   G01  hub gate, the main arrival point off the transit and parking hub, ~19 m  -> 1500
#   G02  plaza gate A, the primary secure entry, ~11.5 m                          ->  900
#   G03  plaza gate B, a narrow secondary entry, ~3.2 m                           ->  250
#   G04  market gate, ~7.7 m                                                      ->  600
#
# G03 is deliberately the tight one. Its share of the snan peak is 2,041 per step normally
# and 2,653 under S02, but 4,184 under S05 once it inherits 70 percent of G02's crowd. Any
# capacity in [177, 279] persons/min therefore flows freely in S01 and S02 yet saturates in
# S05, so a queue builds in the Z05 holding area. That is the mechanism behind the docs/07
# Phase 2 expectation that S05 raises Z05 density, and the docs/05 section 1.2
# "Z05/Z04 risk up". 250 sits in the middle of that window.
# PLACEHOLDERS: replace with each real gate's measured clear width and lane count. If the
# arrivals assumptions change, re-check this window - it is demand-relative, not absolute.
gates:
  G01: {zone_id: Z08, name: Hub gate,     secure: false, throughput_p_min: 1500}
  G02: {zone_id: Z05, name: Plaza gate A, secure: true,  throughput_p_min: 900}
  G03: {zone_id: Z05, name: Plaza gate B, secure: true,  throughput_p_min: 250}
  G04: {zone_id: Z07, name: Market gate,  secure: false, throughput_p_min: 600}

# ------------------------------------------------------------- exits (6)
