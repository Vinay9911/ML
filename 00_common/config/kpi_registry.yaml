# KPI registry - generated from docs/05 section 2 (93 study KPIs + 16 implementation extensions).
#
# `unit`       MUST equal the unit used in every ModelOutput.results[].unit (docs/02 section 5).
# `threshold`  is the example threshold from the study. It is a PLACEHOLDER kept for traceability
#              only; no code may read it as a decision boundary.
# `direction`  higher_is_worse | higher_is_better. higher_is_better == the "(down bad)" marker in docs/05.
# `band`       table in risk_bands.yaml used to derive risk_level; null = the owning model decides.
# `band_input` `value` (default) or `complement_100` for "(down bad)" percentages where the risk is
#              carried by the shortfall, i.e. 100 - value. See plans/PHASE_1.md decision D1: this
#              avoids inventing a 5th band table beyond the four defined in docs/05 section 3.
# `bounds`     per-KPI [min, max] override of unit_bounds; null on a side means unbounded there.
# `extension`  true for the 16 KPIs this implementation added beyond the 93 study KPIs.
meta:
  version: "1.0"
  study_kpi_count: 93
  extension_count: 16
  source: "docs/05_SCENARIOS_KPIS_FORMULAS.md section 2"

# Allowed units - docs/02 section 5, exhaustive. ASCII spellings are canonical:
# persons/m2 == persons/m^2, ug/m3 == micrograms per cubic metre, degC == degrees Celsius.
allowed_units:
  - persons
  - persons/hr
  - persons/min
  - persons/m2
  - persons/m2/min
  - m
  - min
  - m/s
  - "%"
  - ratio
  - score_0_100
  - vehicles
  - vehicles/hr
  - vehicles/km
  - km/h
  - cases/hr
  - cases
  - units/day
  - units
  - beds
  - posts
  - points
  - routes
  - teams
  - personnel
  - incidents/hr
  - L/hr
  - MLD
  - kg/day
  - meals/hr
  - hours
  - trips/day
  - cycles/day
  - MW
  - dB
  - ug/m3
  - index
  - tCO2e/day
  - degC
  - mm/hr

# Default numeric sanity bounds per unit. null = unbounded on that side.
# persons/m2 max of 9 comes from the docs/04 section 8 physical-sanity invariant.
unit_bounds:
  persons: [0, null]
  persons/hr: [0, null]
  persons/min: [0, null]
  persons/m2: [0, 9]
  persons/m2/min: [null, null]
  m: [0, null]
  min: [0, null]
  m/s: [0, null]
  "%": [0, 100]
  ratio: [0, null]
  score_0_100: [0, 100]
  vehicles: [0, null]
  vehicles/hr: [0, null]
  vehicles/km: [0, null]
  km/h: [0, null]
  cases/hr: [0, null]
  cases: [0, null]
  units/day: [0, null]
  units: [0, null]
  beds: [0, null]
  posts: [0, null]
  points: [0, null]
  routes: [0, null]
  teams: [0, null]
  personnel: [0, null]
  incidents/hr: [0, null]
  L/hr: [0, null]
  MLD: [0, null]
  kg/day: [0, null]
  meals/hr: [0, null]
  hours: [0, null]
  trips/day: [0, null]
  cycles/day: [0, null]
  MW: [0, null]
  dB: [0, null]
  ug/m3: [0, null]
  index: [0, null]
  tCO2e/day: [0, null]
  degC: [-50, 70]
  mm/hr: [0, null]

