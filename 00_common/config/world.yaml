  E01: {zone_id: Z05, name: Plaza exit,          width_m: 8.0, status: open}
  E02: {zone_id: Z08, name: Hub exit,            width_m: 12.0, status: open}
  E03: {zone_id: Z03, name: Corridor side lane,  width_m: 4.0, status: open}
  E04: {zone_id: Z01, name: Ghat A emergency,    width_m: 6.0, status: open}
  E05: {zone_id: Z06, name: Far bank exit,       width_m: 5.0, status: open}
  E06: {zone_id: Z07, name: Market exit,         width_m: 6.0, status: open}

