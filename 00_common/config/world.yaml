  TC07: {zone_id: Z07, max_units: 60, low_lying: false}
  TC08: {zone_id: Z08, max_units: 100, low_lying: false}
water_points:
  WP01: {zone_id: Z01}
  WP02: {zone_id: Z01}
  WP03: {zone_id: Z02}
  WP04: {zone_id: Z03}
