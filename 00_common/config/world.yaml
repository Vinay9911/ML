  GEN02: {zone_id: Z03, substation: SS01, serves: [MP02]}
  GEN03: {zone_id: Z05, substation: SS02, serves: [MP03]}
  GEN04: {zone_id: Z08, substation: SS02, serves: [H02]}
pumps:
  PMP01: {zone_id: Z01, substation: SS01, design_lph: 20000}
  PMP02: {zone_id: Z05, substation: SS02, design_lph: 25000}
  PMP03: {zone_id: Z08, substation: SS02, design_lph: 30000}
network_towers:
  NT01: {zone_id: Z05, substation: SS02}
  NT02: {zone_id: Z01, substation: SS01}
  NT03: {zone_id: Z08, substation: SS02}

# ----------------------------------------------------------- cameras (24)
# mode: sparse (detection+tracking) or dense (density map). See M02 card.
# fov is a simple sector: bearing_deg (from north, clockwise), half_angle_deg, range_m.
cameras:
  count: 24
  default_bitrate_mbps: 4
  placement:
    # zone_id: [ [camera_id, mode, tower_id, bearing_deg, half_angle_deg, range_m], ... ]
    Z01: [[CAM01, dense, NT02, 180, 35, 60], [CAM02, dense, NT02, 220, 35, 60], [CAM03, sparse, NT02, 90, 30, 40]]
    Z02: [[CAM04, dense, NT02, 170, 35, 55], [CAM05, sparse, NT02, 100, 30, 40], [CAM06, dense, NT02, 210, 35, 55]]
    Z03: [[CAM07, dense, NT01, 0, 30, 50], [CAM08, sparse, NT01, 45, 30, 40], [CAM09, sparse, NT01, 315, 30, 40]]
    Z04: [[CAM10, dense, NT01, 10, 35, 60], [CAM11, sparse, NT01, 190, 30, 45]]
    Z05: [[CAM12, dense, NT01, 20, 40, 70], [CAM13, sparse, NT01, 70, 25, 35], [CAM14, sparse, NT01, 110, 25, 35], [CAM15, dense, NT01, 250, 40, 70]]
    Z06: [[CAM16, sparse, NT02, 160, 25, 35], [CAM17, dense, NT02, 200, 30, 45]]
    Z07: [[CAM18, dense, NT03, 30, 35, 55], [CAM19, sparse, NT03, 120, 30, 40], [CAM20, sparse, NT03, 300, 30, 40]]
    Z08: [[CAM21, dense, NT03, 0, 40, 80], [CAM22, sparse, NT03, 60, 30, 50], [CAM23, sparse, NT03, 180, 30, 50], [CAM24, dense, NT03, 270, 40, 80]]

# --------------------------------------------------- routes and corridors
# VIP origin/destination and the emergency corridors that M14 must keep open.
vip_routes:
  VIP1:
    name: City entry to Ghat A viewpoint
    origin: R01
    destination: Z01
    window: ["06:30", "08:30"]
emergency_corridors:
  EC1: {name: Hospital to temple corridor, from: H01, to: Z03, links: [R09, R07], required_capacity_veh_hr: 600}
  EC2: {name: Fire station to plaza,       from: FS01, to: Z05, links: [R10, R09, R05], required_capacity_veh_hr: 600}
# Preferred alternates that M14 may propose per closed link.
diversion_alternates:
  R07: [[R09, R05], [R08, R06]]
  B01: [[R07, R05]]
evacuation_routes:
  EVAC1: {from: Z01, exits: [E04, E03]}
  EVAC2: {from: Z02, exits: [E05, E03]}
  EVAC3: {from: Z03, exits: [E03, E01]}
  EVAC4: {from: Z05, exits: [E01, E02]}
  EVAC5: {from: Z07, exits: [E06, E01]}
