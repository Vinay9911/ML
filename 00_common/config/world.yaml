# ----------------------------------------------------------- cameras (24)
# mode: sparse (detection+tracking) or dense (density map). See M02 card.
# fov is a simple sector: bearing_deg (from north, clockwise), half_angle_deg, range_m.
#
# Bearings follow the zone shape, because a camera aimed across the narrow axis of a thin
# zone covers almost nothing (see _SHAPE_BY_TYPE in synthetic/layout.py):
#   ghats (Z01, Z02) and the bridge approach (Z06) run east-west  -> aim 90 / 270 along them
#   corridors (Z03, Z04) and the market street (Z07) run north-south -> aim 0 / 180
#   the plaza (Z05) and hub (Z08) are open, so their cameras fan outwards
# Each thin zone also keeps one camera aimed across it, which is how a real mount plan mixes
# along-the-flow and cross-the-flow views.
cameras:
  count: 24
  default_bitrate_mbps: 4
  placement:
    # zone_id: [ [camera_id, mode, tower_id, bearing_deg, half_angle_deg, range_m], ... ]
    Z01: [[CAM01, dense, NT02, 90, 35, 70], [CAM02, dense, NT02, 270, 35, 70], [CAM03, sparse, NT02, 180, 30, 40]]
    Z02: [[CAM04, dense, NT02, 90, 35, 65], [CAM05, sparse, NT02, 270, 30, 55], [CAM06, dense, NT02, 170, 35, 40]]
    Z03: [[CAM07, dense, NT01, 0, 30, 60], [CAM08, sparse, NT01, 180, 30, 50], [CAM09, sparse, NT01, 0, 30, 40]]
    Z04: [[CAM10, dense, NT01, 0, 35, 70], [CAM11, sparse, NT01, 180, 30, 60]]
    Z05: [[CAM12, dense, NT01, 20, 40, 70], [CAM13, sparse, NT01, 70, 25, 35], [CAM14, sparse, NT01, 110, 25, 35], [CAM15, dense, NT01, 250, 40, 70]]
    Z06: [[CAM16, sparse, NT02, 90, 25, 70], [CAM17, dense, NT02, 270, 30, 70]]
    Z07: [[CAM18, dense, NT03, 0, 35, 60], [CAM19, sparse, NT03, 180, 30, 50], [CAM20, sparse, NT03, 90, 30, 30]]
    Z08: [[CAM21, dense, NT03, 0, 40, 80], [CAM22, sparse, NT03, 60, 30, 50], [CAM23, sparse, NT03, 180, 30, 50], [CAM24, dense, NT03, 270, 40, 80]]

