# ------------------------------------------------------------------ assets
substations:
  SS01: {name: Substation A, feeds_zones: [Z01, Z02, Z03, Z04], design_kw: 2500}
  SS02: {name: Substation B, feeds_zones: [Z05, Z06, Z07, Z08], design_kw: 3000}
generators:
