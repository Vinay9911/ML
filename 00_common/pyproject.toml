[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twin_common"
version = "0.1.0"
description = "Shared contracts, config, IO, engines and synthetic world for the Event Digital Twin model services."
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Event Digital Twin team" }]

# Core: every model service needs exactly these.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pip-licenses>=5.0",
]
# Polygons, CRS, areas (docs/06 §1).
geo = [
    "shapely>=2.0",
    "pyproj>=3.6",
]
# Road graph + shortest paths. osmnx v2 API only.
network = [
    "osmnx>=2.0",
    "networkx>=3.3",
]
# Forecasting engine (Phase 4). darts pulls torch.
forecast = [
    "darts>=0.30",
    "lightgbm>=4.3",
]
# GLM Poisson / NegBin (M07).
formula = [
    "statsmodels>=0.14",
]
# Small ML classifier + AI4I download (M23).
mlclf = [
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "ucimlrepo>=0.0.7",
]
# MILP (M16, M24) and location models (M08).
opt = [
    "pulp>=2.8",
    "ortools>=9.10",
    "spopt>=0.6",
]
# Vision (Phase 6). NOTE: ultralytics/boxmot are AGPL and must never be added.
vision = [
    "opencv-python-headless>=4.10",
    "rfdetr>=1.0",
    "trackers>=1.0",
    "supervision>=0.23",
    "lwcc>=0.0.5",
    "torch>=2.2",
    "torchvision>=0.17",
]
# Pedestrian simulation (Phase 8).
pedsim = [
    "jupedsim>=1.2",
]
# Optional, experimental, Linux/WSL only. Never required by tests.
sumo = [
    "eclipse-sumo>=1.20",
    "traci>=1.20",
    "sumolib>=1.20",
]
all = [
    "twin_common[dev,geo,network,forecast,formula,mlclf,opt,vision,pedsim]",
]

[tool.setuptools.packages.find]
include = ["twin_common*"]

[tool.setuptools.package-data]
twin_common = ["py.typed"]
